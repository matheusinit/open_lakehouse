name: open-lakehouse

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/warehouse
        mc anonymous set none local/warehouse
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    restart: unless-stopped

  trino:
    image: trinodb/trino:483
    depends_on:
      iceberg-rest:
        condition: service_started
    ports:
      - "${TRINO_PORT:-8082}:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
    restart: unless-stopped

  sql-editor:
    image: dbeaver/cloudbeaver:26.1.5
    depends_on:
      trino:
        condition: service_healthy
    environment:
      CB_SERVER_NAME: Open Lakehouse SQL Editor
      CB_SERVER_URL: http://localhost:${SQL_EDITOR_PORT:-8978}
      CB_ADMIN_NAME: ${SQL_EDITOR_ADMIN:-admin}
      CB_ADMIN_PASSWORD: ${SQL_EDITOR_PASSWORD:-password123}
    ports:
      - "${SQL_EDITOR_PORT:-8978}:8978"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./infra/cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    restart: unless-stopped

volumes:
  minio-data:
  cloudbeaver-data:

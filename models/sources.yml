version: 2

sources:
  - name: raw
    description: Raw Iceberg tables stored in MinIO.
    database: lakehouse
    schema: raw
    tables:
      - name: customers
        description: Historical customer master records.
        columns:
          - name: customer_id
            data_tests:
              - not_null
              - unique
          - name: updated_at
            data_tests:
              - not_null
          - name: _ingested_at
            description: Timestamp when the raw record first entered the lakehouse.
            data_tests:
              - not_null
      - name: subscription_events
        description: Subscription lifecycle and payment events.
        columns:
          - name: event_id
            data_tests:
              - not_null
              - unique
          - name: event_time
            data_tests:
              - not_null
          - name: _ingested_at
            description: Timestamp when the raw record first entered the lakehouse.
            data_tests:
              - not_null

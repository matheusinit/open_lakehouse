version: 2

models:
  - name: stg_customers
    description: >-
      Clean, one-to-one customer records incrementally merged using the raw
      ingestion timestamp with a two-day lookback window.
    columns:
      - name: customer_id
        description: Unique customer identifier and merge key.
        data_tests:
          - not_null
          - unique
      - name: customer_name
        data_tests:
          - not_null
      - name: email
        data_tests:
          - not_null
          - unique
      - name: country
        data_tests:
          - not_null
      - name: customer_status
        data_tests:
          - not_null
      - name: created_at
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null
      - name: _ingested_at
        description: Timestamp when the raw record first entered the lakehouse.
        data_tests:
          - not_null
      - name: _processed_at
        description: Timestamp when last processed the staging row.
        data_tests:
          - not_null

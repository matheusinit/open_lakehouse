version: 2

models:
  - name: dim_customer_scd2
    description: >-
      Type 2 slowly changing customer dimension backed by the dbt customer
      snapshot. Each customer can have multiple historical versions and one
      current version.
    columns:
      - name: customer_key
        description: Surrogate key generated by dbt for one customer version.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Natural customer key shared across historical versions.
        data_tests:
          - not_null
      - name: valid_from
        description: Timestamp from which this customer version is valid.
        data_tests:
          - not_null
      - name: valid_to
        description: Timestamp until which this version was valid; null for current rows.
      - name: is_current
        description: True when this is the currently valid customer version.
        data_tests:
          - not_null
      - name: _ingested_at
        data_tests:
          - not_null
      - name: _processed_at
        data_tests:
          - not_null

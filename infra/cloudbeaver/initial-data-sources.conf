{
  "folders": {},
  "connections": {
    "generic:trino_jdbc:open-lakehouse": {
      "provider": "generic",
      "driver": "trino_jdbc",
      "name": "Open Lakehouse (Trino)",
      "description": "Trino connection to the local Iceberg lakehouse",
      "save-password": true,
      "show-system-objects": false,
      "read-only": false,
      "configuration": {
        "host": "trino",
        "port": "8080",
        "database": "lakehouse",
        "url": "jdbc:trino://trino:8080/lakehouse",
        "configurationType": "MANUAL",
        "type": "dev",
        "closeIdleConnection": true,
        "auth-model": "native",
        "auth-properties": {
          "userName": "admin"
        }
      }
    }
  },
  "connection-types": {}
}
